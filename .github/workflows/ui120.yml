name: Standalone UI120
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - uses: actions/checkout@v4
      - name: Regression
        run: |
          set -e
          python3 StandaloneUI120/tests/contracts.py
          clang -std=c11 -Wall -Wextra -Werror -pedantic StandaloneUI120/tests/policy.c -o /tmp/ui120-test
          /tmp/ui120-test
          clang++ -x c++ -std=c++11 -Wall -Wextra -Werror -pedantic StandaloneUI120/tests/policy.c -o /tmp/ui120-test-cxx
          /tmp/ui120-test-cxx
      - name: Dependencies
        run: brew install make dpkg ldid xz
      - name: Theos and SDK
        run: |
          set -e
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/ui120-sdks
          cd /tmp/ui120-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> "$GITHUB_ENV"
      - name: Build only standalone package
        working-directory: StandaloneUI120
        env:
          THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
        run: gmake package FINALPACKAGE=1
      - name: Verify package
        run: |
          set -e
          mkdir -p build-ui120
          for deb in StandaloneUI120/packages/*.deb; do
            dpkg-deb -f "$deb"
            dpkg-deb -c "$deb"
            tmp=$(mktemp -d)
            dpkg-deb -x "$deb" "$tmp"
            python3 StandaloneUI120/tests/contracts.py "$tmp"
            find "$tmp" -name StandaloneUI120.dylib -exec otool -L {} \;
            cp "$deb" "build-ui120/UI120-0.1.0-${GITHUB_SHA:0:12}-${{ matrix.scheme }}.deb"
          done
          shasum -a 256 build-ui120/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: UI120-${{ matrix.scheme }}
          path: build-ui120/*.deb
          if-no-files-found: error
